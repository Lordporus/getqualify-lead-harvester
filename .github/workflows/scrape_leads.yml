name: Run Daily Voice AI Lead Harvester

# Automated daily execution and manual on-demand trigger for discovering high-call-volume
# B2B businesses (dental, medical, hvac, legal, autorepair), enriching contact information,
# generating tailored Voice AI pitch hooks, and synchronizing deduplicated leads to Google Sheets.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Number of fresh leads to harvest'
        required: false
        default: '50'
        type: string
  schedule:
    - cron: '30 3 * * *' # Runs daily at 09:00 AM IST (03:30 UTC)

jobs:
  harvest-leads:
    name: Harvest & Sync B2B Voice AI Leads
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install git+https://github.com/Panniantong/agent-reach.git@94f06c1969dfc1834001269d79d3ad0972d9dee6 || true

      - name: Verify GitHub Secrets Configuration
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        run: |
          if [ -z "$GCP_SA_KEY" ]; then
            echo "::error::Missing secret 'GCP_SA_KEY'. Please add it in GitHub: Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          if [ -z "$SPREADSHEET_ID" ]; then
            echo "::error::Missing secret 'SPREADSHEET_ID'. Please add it in GitHub: Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "GitHub Secrets sanity check passed."

      - name: Execute Voice AI Lead Harvester
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          HARVEST_LIMIT: ${{ inputs.limit || '50' }}
        run: |
          python scripts/scrape_leads.py --limit "${HARVEST_LIMIT:-50}"
